<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div id="login" class="hidden"><form id="lf" class="card login"><h1 data-t="title"></h1>
<input id="u" data-p="user" autocomplete="username" required><input id="p" type="password" data-p="pass" autocomplete="current-password" required>
<p id="lerr" class="neg"></p><button class="btn" data-t="signin"></button><button type="button" class="link lang" data-t="lang"></button></form></div>
<div id="app" class="hidden">
<header><h1 data-t="title"></h1><span id="status"></span><button class="link lang" data-t="lang"></button><button class="link" id="out" data-t="signout"></button></header>
<div class="toolbar"><label data-t="period"></label><select id="per"></select><span id="cust" class="hidden row"><input type="date" id="pf"><input type="date" id="pt"></span></div>
<div id="integ"></div>
<section class="hero"><div><small data-t="assets"></small><b id="hA" class="pos"></b></div><div><small data-t="liab"></small><b id="hL" class="pur"></b></div>
<div><small data-t="equity"></small><b id="hE"></b></div><div><small data-t="net"></small><b id="hN"></b></div></section>
<div id="empty" class="card empty hidden"><p data-t="noData"></p><button class="btn" id="first" data-t="first"></button></div>
<section id="charts" class="grid hidden">
<div class="card"><h2 data-t="c1"></h2><div id="c1" class="ch">Loading…</div></div>
<div class="card"><h2 data-t="c4"></h2><div id="c4" class="ch">Loading…</div></div>
<div class="card"><h2 data-t="c2"></h2><div id="c2" class="ch">Loading…</div></div>
<div class="card"><h2 data-t="c3"></h2><div id="c3" class="ch">Loading…</div></div>
<div class="card"><h2 data-t="c5"></h2><div id="c5" class="ch">Loading…</div></div>
<div class="card"><h2 data-t="c7"></h2><div id="c7" class="ch">Loading…</div></div>
<div class="card wide"><div class="row"><h2 data-t="c6"></h2><select id="topn"></select></div><div id="c6" class="ch">Loading…</div></div>
</section>
<main class="grid">
<div class="card"><h2 data-t="coa"></h2><form id="af" class="row"><input id="an" data-p="name" required><select id="at"></select><input id="ao" type="number" step="0.01" value="0" title="Opening"><label class="chk"><input type="checkbox" id="ac"> <span data-t="cash"></span></label><button class="btn" id="asv" data-t="add"></button></form><p id="aerr" class="neg"></p><div id="accts" class="tw"></div></div>
<div class="card"><h2 data-t="entry"></h2><form id="tf" class="col"><input type="date" id="td" required><input id="tm" data-p="memo"><input id="ta" type="number" step="0.01" min="0.01" data-p="amount" required>
<select id="tdb" required></select><select id="tcr" required></select><p id="terr" class="neg"></p><div class="row"><button class="btn" id="tsv"></button><button type="button" class="link hidden" id="tcx" data-t="cancel"></button></div></form></div>
<div class="card wide"><h2 data-t="ledger"></h2><select id="lsel"></select><div class="tw" id="lout"></div></div>
<div class="card wide"><h2 data-t="all"></h2><div class="row"><select id="fsel"></select><input type="date" id="ff"><input type="date" id="ft"></div><div class="tw" id="aout"></div></div>
<div class="card"><h2 data-t="is"></h2><div class="tw" id="isout"></div></div><div class="card"><h2 data-t="bs"></h2><div class="tw" id="bsout"></div></div>
<div class="card wide"><h2 data-t="tb"></h2><div class="tw" id="tbout"></div></div>
</main></div><script src="accounting.js"></script><script src="app.js"></script><script src="charts.js"></script></body></html>
