<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main-content" data-i18n="skipToContent"></a>

  <!-- LOADING (shown only while checking session / fetching data) -->
  <div id="loading-view" class="loading-view" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <p data-i18n="loadingApp"></p>
  </div>

  <!-- LOGIN -->
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="off">
      <div class="login-top">
        <h1>Budget Book</h1>
        <button type="button" class="btn small lang-btn"></button>
      </div>
      <p class="muted" data-i18n="loginIntro"></p>
      <label><span data-i18n="username"></span>
        <input id="login-user" type="text" required autocomplete="username">
      </label>
      <label><span data-i18n="password"></span>
        <input id="login-pass" type="password" required autocomplete="current-password">
      </label>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button type="submit" class="btn primary" data-i18n="signIn"></button>
    </form>
  </main>

  <!-- APP -->
  <div id="app-view" hidden>
    <header class="topbar">
      <strong class="brand">Budget Book</strong>
      <div class="topbar-actions">
        <label class="month-pick"><span data-i18n="month"></span>
          <input id="month-input" type="month">
        </label>
        <span id="save-status" class="save-status" role="status" aria-live="polite"></span>
        <button id="export-btn" class="btn" type="button" data-i18n="export"></button>
        <button id="import-btn" class="btn" type="button" data-i18n="import"></button>
        <input id="import-file" type="file" accept="application/json" hidden>
        <button type="button" class="btn lang-btn"></button>
        <button id="logout-btn" class="btn" type="button" data-i18n="logout"></button>
      </div>
    </header>

    <nav class="quick-nav" aria-label="Section">
      <a href="#section-income" data-i18n="income"></a>
      <a href="#section-expense" data-i18n="expenses"></a>
      <a href="#section-savings" data-i18n="savings"></a>
      <a href="#section-liab" data-i18n="liabilities"></a>
      <a href="#section-budget" data-i18n="budgets"></a>
    </nav>

    <main class="wrap" id="main-content">
      <!-- ONBOARDING CHECKLIST (hidden once dismissed or once data exists) -->
      <section id="checklist" class="panel checklist" hidden>
        <div class="checklist-head">
          <h2 data-i18n="checklistTitle"></h2>
          <button type="button" id="checklist-dismiss" class="btn small ghost" data-i18n="dismiss"></button>
        </div>
        <ul id="checklist-items" class="checklist-items"></ul>
      </section>

      <!-- CASH FLOW -->
      <section class="hero" aria-labelledby="hero-title">
        <p id="hero-title" class="hero-label"></p>
        <p id="hero-net" class="hero-net">₱0.00</p>
        <p id="hero-note" class="muted"></p>

        <div id="split-bar" class="split-bar" role="img"></div>

        <dl class="figures">
          <div><dt><i class="dot income"></i><span data-i18n="moneyIn"></span></dt><dd id="fig-income">₱0.00</dd></div>
          <div><dt><i class="dot expense"></i><span data-i18n="expenses"></span></dt><dd id="fig-expenses">₱0.00</dd></div>
          <div><dt><i class="dot debt"></i><span data-i18n="liabPayments"></span></dt><dd id="fig-debt">₱0.00</dd></div>
          <div><dt><i class="dot save"></i><span data-i18n="savedMonth"></span></dt><dd id="fig-saved">₱0.00</dd></div>
          <div><dt><span data-i18n="totalSavings"></span></dt><dd id="fig-savings">₱0.00</dd></div>
          <div><dt><span data-i18n="totalOwed"></span></dt><dd id="fig-owed">₱0.00</dd></div>
        </dl>
      </section>

      <!-- TREND -->
      <section class="panel trend" aria-labelledby="trend-title">
        <h2 id="trend-title" data-i18n="trend"></h2>
        <div id="trend-chart" class="trend-chart"></div>
        <p class="legend"><i class="dot income"></i><span data-i18n="legendIn"></span> <i class="dot out"></i><span data-i18n="legendOut"></span></p>
      </section>

      <div class="panels">
        <!-- INCOME -->
        <section class="panel" id="section-income" aria-labelledby="income-title">
          <h2 id="income-title" data-i18n="income"></h2>
          <form id="income-form" class="entry-form">
            <input name="description" required maxlength="60" data-i18n-ph="incSource">
            <input name="amount" type="number" min="0.01" step="0.01" required data-i18n-ph="amount">
            <input name="date" type="date" required data-i18n-ph="date">
            <div class="form-buttons">
              <button class="btn primary submit-btn" type="submit" data-i18n="addIncome"></button>
              <button class="btn cancel-btn" type="button" hidden data-i18n="cancel"></button>
            </div>
          </form>
          <ul id="income-list" class="list"></ul>
        </section>

        <!-- EXPENSES -->
        <section class="panel" id="section-expense" aria-labelledby="expense-title">
          <h2 id="expense-title" data-i18n="expenses"></h2>
          <form id="expense-form" class="entry-form">
            <input name="description" required maxlength="60" data-i18n-ph="expDesc">
            <select name="category" data-i18n-ph="category"></select>
            <input name="amount" type="number" min="0.01" step="0.01" required data-i18n-ph="amount">
            <input name="date" type="date" required data-i18n-ph="date">
            <div class="form-buttons">
              <button class="btn primary submit-btn" type="submit" data-i18n="addExpense"></button>
              <button class="btn cancel-btn" type="button" hidden data-i18n="cancel"></button>
            </div>
          </form>
          <ul id="expense-list" class="list"></ul>
        </section>

        <!-- SAVINGS -->
        <section class="panel" id="section-savings" aria-labelledby="savings-title">
          <h2 id="savings-title" data-i18n="savings"></h2>
          <p class="panel-figure"><span data-i18n="totalSavings"></span>: <strong id="savings-total">₱0.00</strong></p>
          <form id="savings-form" class="entry-form">
            <select name="type" data-i18n-ph="savType">
              <option value="deposit" data-i18n="depositOpt"></option>
              <option value="withdraw" data-i18n="withdrawOpt"></option>
            </select>
            <input name="description" maxlength="60" data-i18n-ph="savNote">
            <input name="amount" type="number" min="0.01" step="0.01" required data-i18n-ph="amount">
            <input name="date" type="date" required data-i18n-ph="date">
            <p class="error form-error" role="alert" hidden></p>
            <div class="form-buttons">
              <button class="btn primary submit-btn" type="submit" data-i18n="addEntry"></button>
              <button class="btn cancel-btn" type="button" hidden data-i18n="cancel"></button>
            </div>
          </form>
          <ul id="savings-list" class="list"></ul>
        </section>

        <!-- LIABILITIES -->
        <section class="panel" id="section-liab" aria-labelledby="liab-title">
          <h2 id="liab-title" data-i18n="liabilities"></h2>
          <form id="liab-form" class="entry-form">
            <input name="name" required maxlength="60" data-i18n-ph="liabName">
            <input name="balance" type="number" min="0.01" step="0.01" required data-i18n-ph="loanAmount">
            <input name="monthly" type="number" min="0.01" step="0.01" data-i18n-ph="usualMonthly">
            <input name="dueDay" type="number" min="1" max="31" step="1" data-i18n-ph="dueDayPh">
            <div class="form-buttons">
              <button class="btn primary submit-btn" type="submit" data-i18n="addLiab"></button>
              <button class="btn cancel-btn" type="button" hidden data-i18n="cancel"></button>
            </div>
          </form>
          <ul id="liab-list" class="list"></ul>
        </section>

        <!-- BUDGETS -->
        <section class="panel" id="section-budget" aria-labelledby="budget-title">
          <h2 id="budget-title" data-i18n="budgets"></h2>
          <form id="budget-form" class="entry-form">
            <select name="category" data-i18n-ph="category"></select>
            <input name="limit" type="number" min="0.01" step="0.01" required data-i18n-ph="budgetLimit">
            <div class="form-buttons">
              <button class="btn primary" type="submit" data-i18n="setBudget"></button>
            </div>
          </form>
          <ul id="budget-list" class="list"></ul>
        </section>
      </div>
    </main>
  </div>

  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
